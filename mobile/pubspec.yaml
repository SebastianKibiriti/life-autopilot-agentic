name: life_autopilot_agentic
description: A minimal Flutter shell for Life Autopilot Agentic.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.3.2
  logger: ^2.0.2
  geolocator: ^9.0.1
  flutter_local_notifications: ^16.1.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.1
  provider: ^6.0.5
  json_annotation: ^4.8.1
  http: ^1.1.0
  url_launcher: ^6.2.1
  flutter_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
